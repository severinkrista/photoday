<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Фото дня</title><link rel="stylesheet" href="style.css"></head><body class="popup"><header><div><h1>Фото дня</h1><div id="period" class="muted"></div></div><button id="openSettings">⚙</button></header><div id="connection" class="status"></div><div id="error" class="error" hidden></div><div id="pending"></div><section id="records" class="records"></section><section class="add-card"><div class="section-title">Новая задача</div><div class="row"><select id="type"></select><div class="difficulty-picker" aria-label="Сложность от 1 до 5"><button id="difficulty-1" type="button" aria-label="1 звезда">★</button><button id="difficulty-2" type="button" aria-label="2 звезды">★</button><button id="difficulty-3" type="button" aria-label="3 звезды">★</button><button id="difficulty-4" type="button" aria-label="4 звезды">★</button><button id="difficulty-5" type="button" aria-label="5 звезд">★</button></div></div><textarea id="task" rows="5" placeholder="Описание задачи"></textarea><label class="file"><input id="attachment" type="file" accept="image/*">＋ Фото / скриншот <span id="attachmentName"></span></label><button id="add" class="primary">Сохранить</button></section><footer><button id="connect">Подключить Яндекс</button><button id="refresh">Обновить</button></footer><script src="popup.js"></script></body></html>
