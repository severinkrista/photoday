<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Фото дня — Настройки</title><link rel="stylesheet" href="style.css"></head><body class="settings"><main><h1>Настройки</h1><section class="panel"><h2>Файл данных</h2><label>Полный путь к XLSX<input id="diskPath"></label></section><section class="panel"><h2>Отображение данных</h2><label><input id="modeTasks" name="mode" type="radio"> Количество задач</label><label><input id="modeDays" name="mode" type="radio"> Количество дней</label><label>Количество задач<input id="tasks" type="number" min="1"></label><label>Количество дней<input id="days" type="number" min="1"></label></section><section class="panel"><h2>Типы задач</h2><div id="types"></div><button id="addType" type="button">＋ Добавить тип</button></section><section class="panel"><h2>Подключение</h2><button id="testConnection" type="button">Проверить подключение</button><div id="testResult" class="result"></div></section><button id="save" class="primary">Сохранить настройки</button><div id="status" class="result"></div></main><script type="module" src="settings.js"></script></body></html>
