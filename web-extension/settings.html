<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Фото дня — Настройки</title><link rel="stylesheet" href="style.css"></head><body class="settings"><main><h1>Настройки</h1><section class="panel"><h2>Файл данных</h2><label>Полный путь к XLSX<input id="diskPath"></label></section><section class="panel"><h2>Отображение данных</h2><div class="display-controls"><div class="mode-switch"><label><input id="modeTasks" name="mode" type="radio"><span>Задачи</span></label><label><input id="modeDays" name="mode" type="radio"><span>Дни</span></label></div><label class="display-number"><span id="displayNumberLabel">Количество</span><input id="tasks" type="number" min="1"></label></div></section><section class="panel"><h2>Типы задач</h2><div id="types"></div><button id="addType" type="button">＋ Добавить тип</button></section><section class="panel"><h2>Подключение</h2><button id="connect" type="button">Подключить Яндекс Диск</button><div id="connectionStatus" class="result"></div><button id="testConnection" type="button">Проверить подключение</button><div id="testResult" class="result"></div></section><button id="save" class="primary">Сохранить настройки</button><button id="clearCache" type="button">Сбросить кэш и локальные данные</button><div id="status" class="result"></div></main><script src="settings.js"></script></body></html>
