name: Android build diagnostics

on:
  push:
    branches: [arena/01a0f774-photoday]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug > /tmp/build.log 2>&1
          status=$?
          echo "===== GRADLE EXIT: $status ====="
          echo "===== COMPILER ERRORS ====="
          grep -E "^e: |error:|^FAILURE|What went wrong|^> [A-Z]" /tmp/build.log | head -80
          echo "===== BUILD LOG TAIL ====="
          tail -25 /tmp/build.log
          exit $status
