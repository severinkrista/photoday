name: Browser extension build
on:
  push:
    branches: [yadisk]
    paths:
      - "web-extension/src/**"
      - "web-extension/*.html"
      - "web-extension/*.css"
      - "web-extension/*.json"
      - "web-extension/build.mjs"
      - ".github/workflows/web-extension-build.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - run: cp dist/popup.js popup.js && cp dist/settings.js settings.js && cp dist/viewer.js viewer.js
      - run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-extension/popup.js web-extension/settings.js
          git diff --cached --quiet || git commit -m "Build browser extension"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: photoday-browser-extension
          path: web-extension/dist
